<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Outer brass gradient ring -->
  <defs>
    <radialGradient id="brassGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B08D57"/>
      <stop offset="100%" stop-color="#8C6D37"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>
  </defs>

  <!-- Full circle background (brass ring) -->
  <circle cx="16" cy="16" r="16" fill="url(#brassGrad)"/>

  <!-- Inner navy circle -->
  <circle cx="16" cy="16" r="12.5" fill="#1B2A4A"/>

  <!-- Shield-check icon in ivory/cream — centered -->
  <!-- Shield path -->
  <path
    d="M16 7.5 L22.5 10 L22.5 17.5 C22.5 21 19.5 23.5 16 24.5 C12.5 23.5 9.5 21 9.5 17.5 L9.5 10 Z"
    fill="none"
    stroke="#F7F4EC"
    stroke-width="1.5"
    stroke-linejoin="round"
  />
  <!-- Checkmark inside shield -->
  <polyline
    points="12.5,16 15,18.5 19.5,13.5"
    fill="none"
    stroke="#B08D57"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
